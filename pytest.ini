[pytest]
# The ROS 2 installation at /opt/ros exposes several pytest plugins via
# PYTHONPATH (launch_testing, launch_pytest, ament_*). They pull in the
# ROS launch stack and register hooks this project neither uses nor
# installs. Disable them so pytest runs against this project only.
addopts = -p no:launch_pytest -p no:launch_testing -p no:launch_testing_ros
testpaths = tests
